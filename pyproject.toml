[project]
name = "containertldr"
version = "0.1.0"
description = "Container update notifications with an LLM summary of the upstream release notes"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Berdarino", email = "contact@bernardwong.dev" }]
dependencies = [
    "httpx>=0.28.1",
    "packaging>=26.3",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
